<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZERO GAMES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#00ff00;font-family:Courier;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
h1{letter-spacing:5px;text-shadow:0 0 10px #0f0}
#game{width:90vw;max-width:340px;height:500px;border:3px solid #0f0;position:relative;background:#0a0a0a;overflow:hidden;margin:10px 0;touch-action:none}
#player{width:32px;height:32px;background:#0f0;position:absolute;bottom:15px;left:154px;box-shadow:0 0 15px #0f0;border-radius:3px}
.enemy{width:28px;height:28px;background:red;position:absolute;border-radius:3px;box-shadow:0 0 10px red}
#ui{font-size:18px}
#over{position:absolute;inset:0;background:rgba(0,0,0,0.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9}
#over button{margin-top:15px;background:#0f0;border:none;padding:12px 25px;font-size:18px;font-weight:bold}
</style>
</head>
<body>
<h1>ZERO</h1>
<div id="ui">SCORE: <span id="s">0</span> | BEST: <span id="b">0</span></div>
<div id="game"><div id="player"></div><div id="over"><h2>DEAD</h2><p id="msg"></p><button onclick="location.reload()">RETRY</button></div></div>
<p style="font-size:12px;opacity:0.6">حرك صبعك داخل المربع</p>
